name: Confirm archived P030 v1.0.1 file and metadata
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/.check-p030-zenodo-once.yml'
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify exact public Zenodo record metadata and files
        run: |
          python3 - <<'PY'
          import urllib.request,json
          url='https://zenodo.org/api/records/24457811'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (research verification)','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as response: d=json.load(response)
          m=d.get('metadata',{})
          files=d.get('files',{}).get('entries',{}) if isinstance(d.get('files'),dict) else d.get('files',[])
          if isinstance(files,dict):
              listing=[{'name':k,'size':v.get('size'),'checksum':v.get('checksum')} for k,v in files.items()]
          else:
              listing=[{'name':x.get('key'),'size':x.get('size'),'checksum':x.get('checksum')} for x in files]
          print('ZENODO_VERIFIED_RECORD',json.dumps({'id':d.get('id'),'doi':d.get('doi'),'version':m.get('version'),'title':m.get('title'),'files':listing,'related_identifiers':m.get('related_identifiers',[]),'status':d.get('status')}),flush=True)
          assert str(d.get('doi'))=='10.5281/zenodo.24457811'
          assert str(m.get('version'))=='1.0.1'
          assert 'P030' in m.get('title','')
          assert listing, 'No archived files provided in Zenodo record'
          print('P030_ZENODO_24457811_METADATA_FILES_PASS',flush=True)
          PY
