name: Confirm Zenodo DOI for P030 v1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/.check-p030-zenodo-once.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Look up DOI in public Zenodo API
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, time, sys
          for attempt in range(1, 8):
              try:
                  url="https://zenodo.org/api/records?"+urllib.parse.urlencode({"q":"P030 Nasreddine","size":50,"allversions":"true"})
                  req=urllib.request.Request(url, headers={"User-Agent":"P030-Research-Archive-Verification/1.0","Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data=json.load(response)
                  hits=data.get("hits",{}).get("hits",[])
                  results=[]
                  for h in hits:
                      m=h.get("metadata",{})
                      title=m.get("title","")
                      if "P030" not in title.upper():continue
                      results.append({"id":h.get("id"),"version":m.get("version"),"doi":h.get("doi") or h.get("pids",{}).get("doi",{}).get("identifier"),"title":title,"published":h.get("publication_date"),"link":h.get("links",{}).get("self_html")})
                  print("ZENODO_QUERY",attempt,json.dumps(results,ensure_ascii=True),flush=True)
                  found=[x for x in results if str(x.get("version")) in ("1.0.1","v1.0.1")]
                  if found:
                      print("P030_ZENODO_VERSION_1_0_1_CONFIRMED",json.dumps(found),flush=True)
                      break
              except Exception as e:
                  print("ZENODO_QUERY_ERROR",attempt,type(e).__name__,str(e),flush=True)
              if attempt<7:time.sleep(9)
          PY
