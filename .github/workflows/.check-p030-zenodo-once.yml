name: Confirm Zenodo DOI for P030 v1.0.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/.check-p030-zenodo-once.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query Zenodo public record and search endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json
          base='https://zenodo.org'
          paths=[
            '/api/records/24456646',
            '/api/records/24456646/versions',
            '/api/records?q=P030&size=50',
            '/api/records?q=P030',
            '/api/records/?q=P030'
          ]
          for path in paths:
              u=base+path
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (research verification)','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      body=response.read().decode('utf-8','replace')
                      status=response.status
                  print('ZENODO_RESPONSE',path,status,flush=True)
                  try:
                      data=json.loads(body)
                      if isinstance(data.get('hits'),dict):
                          hits=data['hits'].get('hits',[])
                          print('ZENODO_RESULTS',json.dumps([{'id':h.get('id'),'doi':h.get('doi'),'version':h.get('metadata',{}).get('version'),'title':h.get('metadata',{}).get('title'),'url':h.get('links',{}).get('self_html')} for h in hits[:30]]),flush=True)
                      else:
                          print('ZENODO_RECORD',json.dumps({'id':data.get('id'),'doi':data.get('doi'),'version':data.get('metadata',{}).get('version'),'links':data.get('links'),'versions':data.get('hits',{}).get('hits') if isinstance(data.get('hits'),dict) else None})[:3500],flush=True)
                  except Exception:print('ZENODO_BODY',body[:1200],flush=True)
              except urllib.error.HTTPError as exc:
                  print('ZENODO_HTTP_ERROR',path,exc.code,exc.read().decode('utf-8','replace')[:1000],flush=True)
              except Exception as exc:print('ZENODO_ERROR',path,type(exc).__name__,str(exc),flush=True)
          PY
