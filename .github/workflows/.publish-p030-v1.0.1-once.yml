name: Publish pinned P030 v1.0.1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/.publish-p030-v1.0.1-once.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_SHA: 8ed9c588145c970999d135dbafa9751c828988a1
      VERIFIED_RUN_ID: "45129112624"
      RELEASE_TAG: v1.0.1
    steps:
      - name: Ensure source commit was verified successfully
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hnasreddine/P030-BKM-Reproducibility"
          gh api "repos/$GITHUB_REPOSITORY/commits/$PINNED_SHA" --jq .sha | grep -Fx "$PINNED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" --jq .head_sha | grep -Fx "$PINNED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" --jq .conclusion | grep -Fx success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion=="success")] | length')" -ge 2
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists: refusing to replace it.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag already exists: refusing to move it.' >&2
            exit 1
          fi
      - name: Publish release from the exact tested commit
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$PINNED_SHA" \
            --title "P030 BKM reproducibility v1.0.1" \
            --notes "Source, numerical datasets and mathematical certificate programs for Memory-Induced Entropic Crossovers in Nonnormal Quantum Decay: Uniform Reconstruction and BKM Defects. Version v1.0.1 is pinned to the passing GitHub Actions commit 8ed9c588145c970999d135dbafa9751c828988a1. The single-point continuum BKM enclosure holds under the specified model and arithmetic assumptions; no analogous certification is asserted for other parameters."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish
